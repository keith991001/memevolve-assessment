<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <style>
      .bg { fill: #f7f8f4; }
      .panel { fill: #ffffff; stroke: #dce3dc; stroke-width: 2; }
      .card { stroke-width: 2; }
      .green { fill: #e1f2ea; stroke: #4d9078; }
      .cyan { fill: #e0f1f2; stroke: #55919a; }
      .gold { fill: #f8ecd0; stroke: #c68a2f; }
      .blue { fill: #e4edf8; stroke: #6689b5; }
      .rose { fill: #f7e3e0; stroke: #bd716a; }
      .gray { fill: #eff2ef; stroke: #9ba7a0; }
      .title { font-family: "PingFang SC", "Arial Unicode MS", sans-serif; font-size: 42px; font-weight: 700; fill: #14211d; }
      .subtitle { font-family: "PingFang SC", "Arial Unicode MS", sans-serif; font-size: 20px; font-weight: 500; fill: #5c6964; }
      .section { font-family: "PingFang SC", "Arial Unicode MS", sans-serif; font-size: 27px; font-weight: 700; fill: #13211e; }
      .label { font-family: "PingFang SC", "Arial Unicode MS", sans-serif; font-size: 22px; font-weight: 700; fill: #16231f; }
      .small { font-family: "PingFang SC", "Arial Unicode MS", sans-serif; font-size: 17px; font-weight: 500; fill: #3f504b; }
      .tiny { font-family: "PingFang SC", "Arial Unicode MS", sans-serif; font-size: 15px; font-weight: 500; fill: #687570; }
      .arrow { fill: none; stroke: #2f6259; stroke-width: 4; marker-end: url(#arrowGreen); }
      .outerArrow { fill: none; stroke: #a16c16; stroke-width: 4; marker-end: url(#arrowGold); }
      .softArrow { fill: none; stroke: #8a9691; stroke-width: 3; marker-end: url(#arrowGray); }
      .dash { stroke-dasharray: 10 9; }
    </style>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#14211d" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#2f6259"/>
    </marker>
    <marker id="arrowGold" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#a16c16"/>
    </marker>
    <marker id="arrowGray" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#8a9691"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1120"/>

  <text class="title" x="80" y="72">MemEvolve 方法架构图</text>
  <text class="subtitle" x="80" y="108">内环积累经验，外环进化记忆架构；记忆系统既学习任务，也学习“如何记忆”。</text>

  <!-- EvolveLab design space -->
  <rect class="panel" filter="url(#shadow)" x="72" y="145" width="1656" height="230" rx="12"/>
  <text class="section" x="108" y="190">EvolveLab：统一记忆设计空间</text>
  <text class="small" x="108" y="222">把不同 memory system 统一成四个模块，形成可比较、可搜索、可变异的架构接口。</text>

  <g transform="translate(108,260)">
    <rect class="card green" x="0" y="0" width="360" height="78" rx="10"/>
    <text class="label" x="26" y="32">Encode</text>
    <text class="small" x="26" y="58">轨迹 → insight / skill / tool</text>
  </g>
  <g transform="translate(508,260)">
    <rect class="card cyan" x="0" y="0" width="360" height="78" rx="10"/>
    <text class="label" x="26" y="32">Store</text>
    <text class="small" x="26" y="58">JSON / 向量库 / 图 / 工具库</text>
  </g>
  <g transform="translate(908,260)">
    <rect class="card gold" x="0" y="0" width="360" height="78" rx="10"/>
    <text class="label" x="26" y="32">Retrieve</text>
    <text class="small" x="26" y="58">相似召回 / 混合检索 / 过滤</text>
  </g>
  <g transform="translate(1308,260)">
    <rect class="card blue" x="0" y="0" width="360" height="78" rx="10"/>
    <text class="label" x="26" y="32">Manage</text>
    <text class="small" x="26" y="58">合并 / 剪枝 / 遗忘 / 维护</text>
  </g>

  <!-- Inner loop -->
  <rect class="panel" filter="url(#shadow)" x="72" y="420" width="1656" height="330" rx="12"/>
  <text class="section" x="108" y="466">内环：Experience Evolution</text>
  <text class="small" x="108" y="496">固定候选记忆架构，让 Agent 在任务流上执行并在线更新记忆库。</text>

  <g transform="translate(110,555)">
    <rect class="card gray" x="0" y="0" width="245" height="118" rx="10"/>
    <text class="label" x="28" y="40">任务流 Q</text>
    <text class="small" x="28" y="70">GAIA / xBench</text>
    <text class="small" x="28" y="96">WebWalkerQA 等</text>
  </g>

  <g transform="translate(430,532)">
    <rect class="card green" x="0" y="0" width="330" height="164" rx="10"/>
    <text class="label" x="30" y="42">候选记忆系统 Ωj</text>
    <text class="small" x="30" y="78">Ωj = (E, U, R, G)</text>
    <text class="small" x="30" y="106">每个候选独立评估</text>
    <text class="small" x="30" y="134">从空记忆 Mt = ∅ 开始</text>
  </g>

  <g transform="translate(835,532)">
    <rect class="card cyan" x="0" y="0" width="350" height="164" rx="10"/>
    <text class="label" x="30" y="42">Agent + Memory</text>
    <text class="small" x="30" y="78">Retrieve 提供上下文</text>
    <text class="small" x="30" y="106">Agent 执行动作</text>
    <text class="small" x="30" y="134">Encode / Store 吸收轨迹</text>
  </g>

  <g transform="translate(1260,532)">
    <rect class="card gold" x="0" y="0" width="330" height="164" rx="10"/>
    <text class="label" x="30" y="42">轨迹与反馈</text>
    <text class="small" x="30" y="78">τ = (s0, a0, ..., sT)</text>
    <text class="small" x="30" y="106">成功率 / token 成本</text>
    <text class="small" x="30" y="134">延迟 / 步数 / 日志</text>
  </g>

  <path class="arrow" d="M355 614 H430"/>
  <path class="arrow" d="M760 614 H835"/>
  <path class="arrow" d="M1185 614 H1260"/>
  <path class="softArrow" d="M1010 696 C1000 736, 590 736, 560 698"/>
  <text class="tiny" x="705" y="730">同一候选在任务序列中持续更新 memory state</text>

  <g transform="translate(1470,708)">
    <rect class="card rose" x="0" y="0" width="180" height="54" rx="10"/>
    <text class="small" x="26" y="34">聚合 Fj</text>
  </g>
  <path class="outerArrow" d="M1470 696 V708"/>

  <!-- Outer loop -->
  <rect class="panel" filter="url(#shadow)" x="72" y="795" width="1656" height="245" rx="12"/>
  <text class="section" x="108" y="842">外环：Architectural Evolution</text>
  <text class="small" x="108" y="872">根据候选表现做选择、诊断和重新设计，生成下一代可执行记忆架构。</text>

  <g transform="translate(110,920)">
    <rect class="card rose" x="0" y="0" width="300" height="94" rx="10"/>
    <text class="label" x="28" y="38">Pareto 排序</text>
    <text class="small" x="28" y="66">性能↑ 成本↓ 延迟↓</text>
  </g>

  <g transform="translate(500,920)">
    <rect class="card gold" x="0" y="0" width="300" height="94" rx="10"/>
    <text class="label" x="28" y="38">Diagnosis</text>
    <text class="small" x="28" y="66">回放轨迹，定位缺陷</text>
  </g>

  <g transform="translate(890,920)">
    <rect class="card blue" x="0" y="0" width="300" height="94" rx="10"/>
    <text class="label" x="28" y="38">Design</text>
    <text class="small" x="28" y="66">修改 E / U / R / G</text>
  </g>

  <g transform="translate(1280,920)">
    <rect class="card green" x="0" y="0" width="340" height="94" rx="10"/>
    <text class="label" x="28" y="38">下一代候选 {Ω′}</text>
    <text class="small" x="28" y="66">进入下一轮内环评估</text>
  </g>

  <path class="outerArrow" d="M410 967 H500"/>
  <path class="outerArrow" d="M800 967 H890"/>
  <path class="outerArrow" d="M1190 967 H1280"/>
  <path class="outerArrow" d="M1510 762 V920"/>
  <path class="outerArrow dash" d="M1620 967 C1710 910, 1710 505, 1548 376"/>

  <text class="tiny" x="108" y="1078">图中绿色/蓝色模块表示可进化的 memory architecture；金色箭头表示外环 meta-evolution；灰色箭头表示内环在线记忆积累。</text>
</svg>
